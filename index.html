<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gjelard Karrica | Lab Notes</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="nav-container">
            <a href="#/blog" class="logo">My Lab Notes</a>
            <div class="nav-links">
                <button id="theme-toggle" aria-label="Toggle dark mode" style="background:none; border:none; cursor:pointer; font-size:1.1rem; padding:0; margin-right:1rem;">🌓</button>
                <a href="#/blog" id="nav-blog" class="active">Blog</a>
                <a href="#/vlog" id="nav-vlog">Vlog</a>
            </div>
        </nav>
    </header>
    <div id="progress-bar" style="position: fixed; top: 0; left: 0; width: 0%; height: 3px; background: var(--accent); z-index: 1000; transition: width 0.1s ease;"></div>
    <main id="content" class="container">
        <!-- JS injects views here -->
        <div class="search-wrap" id="search-container" style="display:none; margin-bottom: 2rem;">
            <input type="text" id="search-input" placeholder="Search articles or topics across models..." autocomplete="off">
        </div>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
