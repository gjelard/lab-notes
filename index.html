<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lab Notes — A Journal of Science & Philosophy</title>
        <link rel="stylesheet" href="css/style.css">

        <!-- Primary Open Graph Meta Framework Elements -->
        <meta property="og:type" content="website">
        <meta property="og:title" content="Lab Notes — A Journal of Science & Philosophy">
        <meta property="og:description" content="Exploring physical substrates, quantum concepts, biological cell signaling networks, and structured matter frameworks.">
        <meta property="og:url" content="https://gjelard.github.io/lab-notes/">
        <meta property="og:image" content="https://gjelard.github.io/lab-notes/img/og-banner.jpg">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">

        <!-- Secondary X / Twitter Card Meta Enhancements -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Lab Notes — A Journal of Science & Philosophy">
        <meta name="twitter:description" content="Exploring physical substrates, quantum concepts, biological cell signaling networks, and structured matter frameworks.">
        <meta name="twitter:image" content="https://gjelard.github.io/lab-notes/img/og-banner.jpg">
    </head>
<body>

    <header>
        <nav class="nav-container">
            <a href="#/blog" class="logo">My Lab Notes</a>
            <div class="nav-links">
                <button id="theme-toggle" aria-label="Toggle dark mode" style="background:none; border:none; cursor:pointer; font-size:1.1rem; padding:0; margin-right:1rem;">🌓</button>
                <a href="#/blog" id="nav-blog" class="active">Blog</a>
                <a href="#/vlog" id="nav-vlog">Vlog</a>
            </div>
        </nav>
    </header>
    <div id="progress-bar" style="position: fixed; top: 0; left: 0; width: 0%; height: 3px; background: var(--accent); z-index: 1000; transition: width 0.1s ease;"></div>
    <main id="content" class="container">
        <!-- JS injects views here -->
        <div class="search-wrap" id="search-container" style="display:none; margin-bottom: 2rem;">
            <input type="text" id="search-input" placeholder="Search articles or topics across models..." autocomplete="off">
        </div>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
