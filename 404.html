<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Intercept 404 pathing, extract target subroutes, and pass them cleanly back via routing hashes
        var currentPath = window.location.pathname;
        var repoName = "/"; // If your URL has a repo name subdirectory structure (e.g. /my-blog/), change this string to match it

        // Clean out path strings and forward back home cleanly
        var targetHash = '#/' + currentPath.replace(repoName, '').replace(/^\/|\/$/g, '');
        window.location.replace(window.location.origin + repoName + targetHash);
    </script>
</head>
<body>
    <p>Redirecting you back down to the main journal feed routing map...</p>
</body>
</html>
